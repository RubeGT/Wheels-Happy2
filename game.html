<body oncontextmenu="return false;">
    <div id="og-game-holder">
        <p style="color:white" id="loading-indicator">Loading...</p>
    </div>
    <script>
        (function() {
            var NativeXMLHttpRequest = window.XMLHttpRequest;
            function AuthenticatedXMLHttpRequest() {
                var xhr = new NativeXMLHttpRequest();
                var send = xhr.send;
                xhr.send = function(body) {
                    var token;
                    try {
                        token = window.localStorage.getItem("wheelsHappyAccessToken");
                    } catch (error) {
                        console.error("Could not read the game account session:", error);
                    }
                    if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);
                    return send.call(xhr, body);
                };
                return xhr;
            }
            AuthenticatedXMLHttpRequest.prototype = NativeXMLHttpRequest.prototype;
            Object.setPrototypeOf(AuthenticatedXMLHttpRequest, NativeXMLHttpRequest);
            window.XMLHttpRequest = AuthenticatedXMLHttpRequest;
        })();
        function report_loading_issue() {
            var el = document.createElement("img");
            el.src = "/DEBUG2/wrong-ref.png?wl=" + window.location + "&wpl=" + window.parent.location + "&wlh=" + window.location.host + "&wplh=" + window.parent.location.host;
            el.style.position = "absolute";
            el.style.left = "-9999px";
            el.style.top = "-9999px";
            document.body.appendChild(el);
        }
		const pathToMyURL = 'https://wheels-happy2-api.onrender.com/get_level.hw';
		

        (function() {
            window["HW_SETTINGS"] = {
                siteURL: "https://wheels-happy2-api.onrender.com/",
                resolutionZoomIncreaseRatio: 0.5,
                tesselation: "tess2"
            };
            try {
                var gameUserId = window.localStorage.getItem("wheelsHappyGameUserId");
                if (gameUserId && /^\d+$/.test(gameUserId)) {
                    window["HW_SETTINGS"].user_id = Number(gameUserId);
                    window["HW_SETTINGS"].username =
                        window.localStorage.getItem("wheelsHappyGameUsername") || "Player";
                }
            } catch (error) {
                console.error("Could not read the game account profile:", error);
            }
            if(!(window.location != window.parent.location && window.location.host === "totaljerkface.com" && window.parent.location.host === "totaljerkface.com")) {
            }


            var d_el = document.createElement("script");
			
            d_el.src = "js/dependencies.ac8072eb8a22557c1b4828699b35bec7.js";
            d_el.onload = function() {
                var i_el = document.createElement("script");
                i_el.src = "js/index.js";
                // i_el.integrity = "sha384-GKAptyGydgK2fCaxFPGnAip+60TiYdFsB22A5ax8TB2dqT8ockqX1XI1rsr6fJIH";
                i_el.onload = function() {
                    document.getElementById("loading-indicator").remove();
                }

                document.body.appendChild(i_el);
            }
            document.body.appendChild(d_el);
        })();
    </script>
