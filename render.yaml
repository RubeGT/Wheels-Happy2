services:
  - type: web
    name: wheels-happy2-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://rubegt.github.io
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_AUTH_REDIRECT_URL
        value: https://rubegt.github.io/Wheels-Happy2/
